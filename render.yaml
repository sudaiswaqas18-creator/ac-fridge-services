services:
  - type: web
    name: jawzaa-backend
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: "https://jawzaa-website-5pjihc70y-sudais18.vercel.app"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: jawzaa_db
      - key: DB_PORT
        value: "3306"
      - key: JWT_SECRET
        sync: false
