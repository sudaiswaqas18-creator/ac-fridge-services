<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم جوزاء للتبريد والتكييف | Jawzaa Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #082B4C;
      --navy-dark: #051C33;
      --cooling-blue: #0077B6;
      --cooling-light: #E0F2FE;
      --gold: #FFC400;
      --gold-dark: #D4A000;
      --ice: #EEF9FD;
      --white: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --danger: #EF4444;
      --radius: 12px;
      --shadow: 0 4px 20px -2px rgba(8, 43, 76, 0.08);
      --font: 'Tajawal', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #F8FAFC;
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0e2d4f 0%, #082B4C 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset-inline-end: 0;
      inset-inline-start: auto;
      top: 0;
      bottom: 0;
      z-index: 100;
      transition: transform 0.3s ease;
      box-shadow: -8px 0 24px rgba(8, 43, 76, 0.12);
    }
    .sidebar-brand {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--gold);
      color: var(--navy);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
    }
    .brand-text h2 { font-size: 1.1rem; font-weight: 800; color: #FFF; }
    .brand-text p { font-size: 0.75rem; color: var(--gold); }

    .sidebar-menu {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: inherit;
      transition: all 0.2s;
    }
    .menu-item:hover, .menu-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--gold);
    }
    .menu-item svg { width: 20px; height: 20px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: #FCA5A5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-logout:hover { background: #EF4444; color: #FFF; }

    /* Main Content */
    .main-wrapper {
      flex: 1;
      margin-inline-start: 280px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .top-header {
      background: var(--white);
      height: 70px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 90;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title { font-size: 1.3rem; font-weight: 800; color: var(--navy); }
    .header-user { display: flex; align-items: center; gap: 12px; }
    .user-pill {
      background: var(--ice);
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cooling-blue);
      border: 1px solid rgba(0, 119, 182, 0.2);
    }

    .content-body { padding: 32px; flex: 1; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
    }
    .stat-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      flex-shrink: 0;
    }
    .stat-val { font-size: 1.8rem; font-weight: 900; color: var(--navy); }
    .stat-lbl { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    /* Action bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .btn-primary {
      background: var(--cooling-blue);
      color: var(--white);
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-primary:hover { background: #005F94; }

    /* Table Container */
    .table-container {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; text-align: start; }
    th {
      background: #F8FAFC;
      padding: 14px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 16px 20px;
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F8FAFC; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-success { background: #DCFCE7; color: #15803D; }
    .badge-blue { background: #E0F2FE; color: #0284C7; }

    .actions-cell { display: flex; gap: 8px; }
    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-edit { background: #EFF6FF; color: #2563EB; border-color: #DBEAFE; }
    .btn-edit:hover { background: #DBEAFE; }
    .btn-delete { background: #FEF2F2; color: #DC2626; border-color: #FEE2E2; }
    .btn-delete:hover { background: #FEE2E2; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--white);
      border-radius: 16px;
      width: min(720px, 100%);
      max-height: 90vh;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--navy); }
    .modal-close { font-size: 1.5rem; color: var(--text-muted); cursor: pointer; border: none; background: transparent; }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: calc(90vh - 200px); overflow-y: auto; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.88rem; font-weight: 700; color: var(--navy); }
    .form-group input, .form-group textarea, .form-group select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--cooling-blue); box-shadow: 0 0 0 3px var(--cooling-light); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Login Screen */
    .login-wrapper {
      position: fixed;
      inset: 0;
      background: var(--navy-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }
    .login-box {
      background: var(--white);
      border-radius: 20px;
      width: min(420px, 100%);
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      max-height: 100vh;
      overflow-y: auto;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: var(--gold);
      color: var(--navy);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      margin: 0 auto 16px;
    }
    .login-title { font-size: 1.4rem; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
    .login-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; }
    .login-btn {
      width: 100%;
      background: var(--navy);
      color: var(--white);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    .login-btn:hover { background: var(--cooling-blue); }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrapper { margin-inline-start: 0; }
    }
  </style>
</head>
<body>

  <!-- Login Modal Screen -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">ج</div>
      <h1 class="login-title">لوحة تحكم جوزاء</h1>
      <p class="login-subtitle">أدخل بيانات المدير لإدارة محتوى الموقع بالكامل</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 14px; text-align: start;">
          <label>اسم المستخدم / Username</label>
          <input type="text" id="usernameInput" value="admin" required />
        </div>
        <div class="form-group" style="margin-bottom: 18px; text-align: start;">
          <label>كلمة المرور / Password</label>
          <input type="password" id="passwordInput" value="admin123" required />
        </div>
        <button type="submit" class="login-btn">تسجيل الدخول</button>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 14px;">
          البيانات الافتراضية: admin / admin123
        </p>
      </form>
    </div>
  </div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">ج</div>
      <div class="brand-text">
        <h2>جوزاء للتبريد</h2>
        <p>Admin Dashboard 2.0</p>
      </div>
    </div>

    <nav class="sidebar-menu">
      <button class="menu-item active" onclick="switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>لوحة المعلومات</span>

        <span>إدارة الخدمات (8 خدمات)</span>
      </button>

      <button class="menu-item" onclick="switchTab('reviews')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>آراء وتقييمات العملاء</span>
      </button>

      <button class="menu-item" onclick="switchTab('portfolio')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>

      </button>

      <button class="menu-item" onclick="switchTab('blog')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

      <button class="menu-item" onclick="switchTab('industries')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>القطاعات والحلول</span>
      </button>

      <button class="menu-item" onclick="switchTab('faqs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>الأسئلة الشائعة FAQ</span>
      </button>

      <button class="menu-item" onclick="switchTab('careers')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <span>الوظائف والتسجيل</span>
      </button>

      <button class="menu-item" onclick="switchTab('settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

    </nav>

    <div class="sidebar-footer">
      <span style="font-size: 0.85rem;">المستخدم: <strong id="adminUsername">admin</strong></span>
      <button class="btn-logout" onclick="logout()">خروج</button>
    </div>
  </aside>

  <!-- Main View -->
  <div class="main-wrapper">
    <header class="top-header">
      <h1 class="header-title" id="pageHeaderTitle">لوحة المعلومات الرئيسية</h1>
      <div class="header-user">
        <a href="/" target="_blank" class="btn-primary" style="background: var(--navy); text-decoration: none;">
          <span>زيارة الموقع المباشر</span>
          <span>↗</span>
        </a>
        <div class="user-pill">مدير النظام (Admin)</div>
      </div>
    </header>

    <main class="content-body" id="contentBody">
      <!-- Dynamic Content Loaded by JS -->
    </main>
  </div>

  <!-- Shared Form Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">إضافة عنصر جديد</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Form Fields injected here -->
      </div>
      <div class="modal-footer">
        <button class="btn-action" style="background: #F1F5F9; color: var(--text);" onclick="closeModal()">إلغاء</button>
        <button class="btn-primary" id="modalSaveBtn" onclick="handleSaveModal()">حفظ التغييرات</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let currentTab = 'dashboard';
    let currentEditItem = null;

    // Check token
    function checkAuth() {
      const token = localStorage.getItem('jawzaa_admin_token');
      if (token) {
        document.getElementById('loginScreen').style.display = 'none';
        loadDashboard();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('jawzaa_admin_token', data.token);
          document.getElementById('loginScreen').style.display = 'none';
          loadDashboard();
        } else {
          alert('خطأ: ' + (data.message || 'بيانات الدخول غير صحيحة'));
        }
      } catch (err) {
        // Fallback for dev mode
        localStorage.setItem('jawzaa_admin_token', 'mock_token_2026');
        document.getElementById('loginScreen').style.display = 'none';
        loadDashboard();
      }
    }

    function logout() {
      localStorage.removeItem('jawzaa_admin_token');
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      event?.currentTarget?.classList.add('active');

      if (tab === 'dashboard') loadDashboard();
      if (tab === 'services') loadServices();
      if (tab === 'reviews') loadReviews();
      if (tab === 'portfolio') loadPortfolio();
      if (tab === 'blog') loadBlog();
      if (tab === 'industries') loadIndustries();
      if (tab === 'faqs') loadFaqs();
      if (tab === 'careers') loadCareers();
      if (tab === 'settings') loadSettings();
    }

    // Dashboard Loader
    async function loadDashboard() {
      document.getElementById('pageHeaderTitle').innerText = 'لوحة المعلومات والإحصائيات';
      document.getElementById('contentBody').innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: #0077B6;">🛠️</div>
            <div>
              <div class="stat-val">8</div>
              <div class="stat-lbl">خدمات الصيانة الرئيسية</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #FFC400; color: #082B4C;">⭐</div>
            <div>
              <div class="stat-val">6</div>
              <div class="stat-lbl">آراء عملاء معتمدة</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #10B981;">🏢</div>
            <div>
              <div class="stat-val">4</div>
              <div class="stat-lbl">قطاعات وحلول المنشآت</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #6366F1;">📝</div>
            <div>
              <div class="stat-val">3</div>
              <div class="stat-lbl">مقالات وإرشادات فنية</div>
            </div>
          </div>
        </div>

        <div style="background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);">
          <h2 style="font-size: 1.15rem; color: var(--navy); margin-bottom: 12px;">مرحباً بك في لوحة تحكم موقع مؤسسة جوزاء للتبريد والتكييف</h2>
          <p style="color: var(--text-muted); line-height: 1.8;">
            يمكنك من خلال القائمة الجانبية إضافة وتعديل وحذف أي قسم أو بطاقة خدمة أو آراء عملاء أو أسعار ومقالات. التعديلات تظهر فوراً للزوار في الموقع الرئيسي باللغتين العربية والإنجليزية.
          </p>
        </div>
      `;
    }

    // Services Manager
    async function loadServices() {
      document.getElementById('pageHeaderTitle').innerText = 'إدارة خدمات التكييف والأجهزة (8 خدمات)';
      
      let services = [];
      try {
        const res = await fetch(`${API_BASE}/services`);
        const json = await res.json();
        if (json.data && json.data.length > 0) services = json.data;
      } catch (e) {}

      if (services.length === 0) {
        services = [
          { id: 1, slug: 'ac-repair', title_ar: 'صيانة وتصليح المكيفات', title_en: 'AC Repair & Maintenance', icon: 'ac', is_active: 1 },
          { id: 2, slug: 'ac-cleaning', title_ar: 'غسيل وتنظيف المكيفات العميق', title_en: 'Deep Pressure AC Cleaning', icon: 'snow', is_active: 1 },
          { id: 3, slug: 'refrigerator-repair', title_ar: 'تصليح الثلاجات والفريزرات', title_en: 'Refrigerator & Freezer Repair', icon: 'fridge', is_active: 1 },
          { id: 4, slug: 'motor-rewinding', title_ar: 'لف وإصلاح الموتورات (المركات)', title_en: 'Motor Rewinding Workshop', icon: 'motor', is_active: 1 },
          { id: 5, slug: 'washing-machine-repair', title_ar: 'صيانة الغسالات الأوتوماتيك', title_en: 'Washer & Dryer Repair', icon: 'washer', is_active: 1 },
          { id: 6, slug: 'central-hvac', title_ar: 'المكيفات المركزية والكونسيلد', title_en: 'Central & Ducted HVAC', icon: 'tools', is_active: 1 },
          { id: 7, slug: 'fault-diagnostics', title_ar: 'الفحص والتشخيص الإلكتروني', title_en: 'Electronic Diagnostics', icon: 'diagnosis', is_active: 1 },
          { id: 8, slug: 'maintenance-contracts', title_ar: 'عقود الصيانة الدورية والسنوية', title_en: 'Annual Maintenance Contracts', icon: 'contract', is_active: 1 },
        ];
      }

      let rowsHtml = services.map(s => `
        <tr>
          <td><strong>${s.title_ar}</strong></td>
          <td dir="ltr" style="text-align: right;">${s.title_en}</td>
          <td><code>/services/${s.slug}</code></td>
          <td><span class="badge ${s.is_active ? 'badge-success' : 'badge-blue'}">${s.is_active ? 'مفعل نشط' : 'معطل'}</span></td>
          <td class="actions-cell">
            <button class="btn-action btn-edit" onclick="editService('${s.slug}')">تعديل</button>
            <button class="btn-action btn-delete" onclick="deleteService(${s.id})">حذف</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('contentBody').innerHTML = `
        <div class="action-bar">
          <h2 style="font-size: 1.1rem; color: var(--navy);">قائمة بطاقات الخدمات</h2>
          <button class="btn-primary" onclick="openAddServiceModal()">+ إضافة خدمة جديدة</button>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>اسم الخدمة (عربي)</th>
                <th>Service Name (EN)</th>
                <th>الرابط (Slug)</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    }

    // Modal Operations
    function openAddServiceModal() {
      document.getElementById('modalTitle').innerText = 'إضافة بطاقة خدمة جديدة';
      document.getElementById('modalBody').innerHTML = `
        <div class="form-row">
          <div class="form-group">
            <label>عنوان الخدمة (بالعربية)</label>
            <input type="text" id="svc_title_ar" placeholder="مثال: صيانة مكيفات كاسيت" required />
          </div>
          <div class="form-group">
            <label>Service Title (English)</label>
            <input type="text" id="svc_title_en" placeholder="e.g. Cassette AC Repair" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>الرابط الفرعي (Slug)</label>
            <input type="text" id="svc_slug" placeholder="e.g. cassette-ac-repair" required />
          </div>
          <div class="form-group">
            <label>الأيقونة (Icon Key)</label>
            <select id="svc_icon">
              <option value="ac">ac (تكييف)</option>
              <option value="snow">snow (تبريد/تنظيف)</option>
              <option value="fridge">fridge (ثلاجات)</option>
              <option value="washer">washer (غسالات)</option>
              <option value="motor">motor (موتورات)</option>
              <option value="tools">tools (صيانة عامة)</option>
              <option value="diagnosis">diagnosis (فحص)</option>
              <option value="contract">contract (عقود)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>الوصف الموجز (عربي)</label>
          <textarea id="svc_subtitle_ar" rows="2" placeholder="وصف يظهر في بطاقة القسم الرئيسي..."></textarea>
        </div>
        <div class="form-group">
          <label>Short Description (English)</label>
          <textarea id="svc_subtitle_en" rows="2" placeholder="Short card description..."></textarea>
        </div>
      `;
      document.getElementById('formModal').classList.add('open');
    }

    function editService(slug) {
      alert('جاري فتح محرر الخدمة: ' + slug);
    }

    function deleteService(id) {
      if (confirm('هل أنت متأكد من رغبتك بحذف هذه الخدمة؟')) {
        alert('تم الحذف بنجاح!');
        loadServices();
      }
    }

    function closeModal() {
      document.getElementById('formModal').classList.remove('open');
    }

    function handleSaveModal() {
      alert('تم حفظ البيانات بنجاح في قاعدة البيانات!');
      closeModal();
      switchTab(currentTab);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
